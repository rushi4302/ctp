services:
  postgres_test:
    image: postgres:17
    container_name: civic_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: civic_db_test
      POSTGRES_USER: civic_user
      POSTGRES_PASSWORD: ${CIVIC_DB_TEST_PASSWORD:?Set CIVIC_DB_TEST_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - civic_test_postgres_data:/var/lib/postgresql/data

volumes:
  civic_test_postgres_data:
